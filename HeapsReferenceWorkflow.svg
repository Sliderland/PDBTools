<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 920" role="img" aria-labelledby="title description">
  <title id="title">Heaps reference sampling workflow</title>
  <desc id="description">For each selected posterior, optionally register entries, sample all RStan chains, then check the returned fit. A failed fit is saved as an RDS when failed-fit or all-fit saving is enabled. A passing fit is saved as an RDS only in all-fit mode, and is written in PosteriorDB reference formats when reference writing is enabled. If sampling never returns a fit, there is no complete fit to save.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .page { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .fail { fill: #fff7ed; stroke: #f59e0b; stroke-width: 2; }
      .pass { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; }
      .note { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #64748b; stroke-width: 2; }
      .title { font: 600 28px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px system-ui, sans-serif; fill: #475569; }
      .head { font: 600 19px system-ui, sans-serif; fill: #0f172a; }
      .body { font: 15px system-ui, sans-serif; fill: #334155; }
      .small { font: 14px system-ui, sans-serif; fill: #475569; }
      .tag { font: 600 14px system-ui, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="page" width="1180" height="920"/>
  <text class="title" x="590" y="47" text-anchor="middle">Heaps reference sampling: one workflow at a time</text>
  <text class="subtitle" x="590" y="77" text-anchor="middle">The RDS archive and PosteriorDB reference files are separate outputs</text>

  <rect class="box" x="360" y="116" width="460" height="94" rx="12"/>
  <text class="head" x="390" y="149">1  Select workflows</text>
  <text class="body" x="390" y="176">Mode, exclusions, and known-problematic filter</text>
  <text class="small" x="390" y="196">Easy group first; hard group needs confirmation</text>

  <path class="line" d="M590 210 V236"/>
  <rect class="box" x="360" y="244" width="460" height="94" rx="12"/>
  <text class="head" x="390" y="274">2  Register, then skip existing references</text>
  <text class="body" x="390" y="301">register_entries / overwrite_registration</text>
  <text class="small" x="390" y="323">skip_completed_references checks files on disk</text>

  <path class="line" d="M590 338 V362"/>
  <rect class="box" x="360" y="370" width="460" height="104" rx="12"/>
  <text class="head" x="390" y="404">3  Sample all RStan chains</text>
  <text class="body" x="390" y="430">Chain count, iterations, warmup, thinning, seed</text>
  <text class="small" x="390" y="455">The complete stanfit exists only when sampling returns</text>

  <path class="line" d="M360 424 H315"/>
  <text class="tag" x="330" y="411" text-anchor="end">no fit</text>
  <rect class="note" x="45" y="373" width="255" height="111" rx="12"/>
  <text class="head" x="69" y="408">Sampler stops early</text>
  <text class="body" x="69" y="436">No complete fit to save</text>
  <text class="small" x="69" y="460">Error or interrupt in sampling</text>

  <path class="line" d="M590 474 V508"/>
  <text class="tag" x="607" y="498">fit returned</text>
  <rect class="box" x="360" y="516" width="460" height="101" rx="12"/>
  <text class="head" x="390" y="550">4  Check the fit</text>
  <text class="body" x="390" y="577">Divergences, R-hat, ESS, EFMI, autocorrelation</text>
  <text class="small" x="390" y="599">The fit stays in memory during these checks</text>

  <path class="branch" d="M590 617 V646 H300 V665"/>
  <path class="branch" d="M590 646 H880 V665"/>
  <path class="line" d="M300 646 V669"/>
  <path class="line" d="M880 646 V669"/>
  <text class="tag" x="300" y="640" text-anchor="middle">FAIL</text>
  <text class="tag" x="880" y="640" text-anchor="middle">PASS</text>

  <rect class="fail" x="45" y="678" width="505" height="138" rx="12"/>
  <text class="head" x="72" y="711">Failed checks or later error</text>
  <text class="body" x="72" y="742">save_failed_fits OR save_all_fits → one fit RDS</text>
  <text class="small" x="72" y="768">Plus a small diagnostics metadata RDS</text>
  <text class="small" x="72" y="793">No PosteriorDB reference write on failed checks</text>

  <rect class="pass" x="630" y="678" width="505" height="138" rx="12"/>
  <text class="head" x="657" y="711">Required checks pass</text>
  <text class="body" x="657" y="742">save_all_fits → one fit RDS, if enabled</text>
  <text class="small" x="657" y="768">write_reference_files → JSON info + zipped JSON draws</text>
  <text class="small" x="657" y="793">Then summaries, verification, and linking</text>

  <path class="line" d="M298 816 V847 H581"/>
  <path class="line" d="M882 816 V847 H599"/>
  <rect class="note" x="390" y="855" width="400" height="47" rx="10"/>
  <text class="body" x="590" y="884" text-anchor="middle">Next workflow, unless stopped or interrupted</text>
</svg>
